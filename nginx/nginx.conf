events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    server {
        listen       80;
        server_name  localhost;
        root         /usr/share/nginx/html;
        index        index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        # manifest.json and service worker - serve directly (no fallback to index.html)
        location = /manifest.json {
            try_files $uri =404;
        }

        location = /service_worker.js {
            try_files $uri =404;
        }

        # Auth authorize page - serve from local frontend (root)
        location = /auth/authorize {
            try_files /authorize.html =404;
        }

        # HA Frontend static files (built locally)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets (frontend_latest, frontend_es5, static)
        location ~* ^/(frontend_latest|frontend_es5|static)/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # No cache for HTML entry points
        location ~* \.(html)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Proxy API calls to Home Assistant backend
        location /api/ {
            proxy_pass http://homeassistant:8123;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_intercept_errors off;
        }

        # Proxy WebSocket
        location /api/websocket {
            proxy_pass http://homeassistant:8123;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Proxy auth API endpoints (not the authorize page)
        location /auth/providers {
            proxy_pass http://homeassistant:8123;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/login {
            proxy_pass http://homeassistant:8123;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/logout {
            proxy_pass http://homeassistant:8123;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/token {
            proxy_pass http://homeassistant:8123;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy onboarding API
        location /onboarding/ {
            proxy_pass http://homeassistant:8123;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
        }
    }
}