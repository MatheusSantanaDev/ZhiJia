version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: zhijia-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - zhijia-network

  frontend:
    image: nginx:alpine
    container_name: zhijia-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - mosquitto
    networks:
      - zhijia-network

networks:
  zhijia-network:
    driver: bridge