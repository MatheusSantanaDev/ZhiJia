<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Comando</title>
</head>

<body>
    <div>
        <h1>Central de Comando</h1>
        <button type="submit" onclick="alert('exemplo')">Botão</button>
    </div>
    <div class="RGB">
        <div>
            <input type="range" class="sliderR" id="red" min="0" max="255" value="0" oninput="updateLED()">
        </div>
        <div>
            <input type="range" class="sliderG" id="green" min="0" max="255" value="0" oninput="updateLED()">
        </div>
        <div>
            <input type="range" class="sliderB" id="blue" min="0" max="255" value="0" oninput="updateLED()">
        </div>
    </div>
</body>

<style>
    body {
        background: rgb(255, 255, 255);
    }
    h1 {
        text-align: center;
        margin-top: 5px;
        margin-bottom: 15px;
    }
    button {
        background-color: black;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 50px;
        cursor: pointer;
    }
    .RGB {
        background: gainsboro;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 150px;
        height: 100px;
        padding: 20px;
        border-radius: 20px;
        margin-left: 5px;
        margin-top: 10px;
        margin-bottom: 10px;
    }

    input[type="range"] {
        -webkit-appearance: none;
        height: 10px;
        border-radius: 10px;
        margin: 10px 0;
    }

    .sliderR::-webkit-slider-runnable-track {
        background: rgb(233, 42, 42);
        height: 10px;
        border-radius: 10px;
        margin: 10px 0;
    }
    .sliderG::-webkit-slider-runnable-track {
        background: rgb(35, 236, 35);
        height: 10px;
        border-radius: 10px;
        margin: 10px 0;
    }
    .sliderB::-webkit-slider-runnable-track {
        background: rgb(48, 138, 240);
        height: 10px;
        border-radius: 10px;
        margin: 10px 0;
    }

    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        align-items: center;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        margin-top: -2px;
        cursor: pointer;
        border: 2px solid white;
    }

    .sliderR::-webkit-slider-thumb {
        background: rgb(255, 0, 0);
    }
    .sliderG::-webkit-slider-thumb {
        background: rgb(0, 255, 0);
    }
    .sliderB::-webkit-slider-thumb {
        background: rgb(0, 0, 255);
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>

<script>
    const client = mqtt.connect('ws://broker.hivemq.com:8000/mqtt'); // Broker público para teste

    client.on('connect', function () {
        console.log('Conectado ao broker MQTT');
    });

    client.on('error', function (error) {
        console.error('Erro na conexão MQTT:', error);
    });

    function updateLED() {
        const red = document.getElementById('red').value;
        const green = document.getElementById('green').value;
        const blue = document.getElementById('blue').value;

        document.body.style.backgroundColor = `rgb(${red}, ${green}, ${blue})`;

        if (client.connected) {
            client.publish('home/led/color', `${red},${green},${blue}`);
        } else {
            console.error('MQTT não está conectado.');
        }
    }
</script>

</html>
