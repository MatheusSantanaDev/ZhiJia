<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Comando</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/logo.png">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header class="main-header">
        <div class="connection-status connecting" id="connectionStatus">
            <span class="status-dot"></span>
            <span class="status-text">Broker MQTT</span>
        </div>
        <h1 id="title">Central de Comando</h1>
        <div class="buttons-container">
            <button type="button" onclick="turnOffLights()">
                <img src="./icons/luz_desligada.svg" alt="Desligar luzes" class="turnOff" />
            </button>
            <button type="button" onclick="whiteLight()">
                <img src="./icons/luz_branca.svg" alt="Luz branca" class="whiteLight" />
            </button>
            <button type="button" onclick="yellowishLight()">
                <img src="./icons/luz_amarela.svg" alt="Luz amarelada" class="yellowish" />
            </button>
        </div>
        </header>

        <div class="spotify-connect-fixed" id="spotifyConnectFixed" style="display: none;">
            <button class="spotify-connect-fixed-btn" onclick="spotifyLogin()" title="Conectar Spotify">
                <svg viewBox="0 0 512 512" width="20" height="20">
                    <rect width="512" height="512" rx="15%" fill="#3bd75f"/>
                    <circle cx="256" cy="256" fill="#fff" r="192"/>
                    <g fill="none" stroke="#3bd75f" stroke-linecap="round">
                        <path d="m141 195c75-20 164-15 238 24" stroke-width="36"/>
                        <path d="m152 257c61-17 144-13 203 24" stroke-width="31"/>
                        <path d="m156 315c54-12 116-17 178 20" stroke-width="24"/>
                    </g>
                </svg>
                <span class="spotify-connect-label">Conectar</span>
            </button>
        </div>

    <main class="main-content">
        <div class="card weather-card horizontal-weather">
            
            <div class="current-weather">
                <div class="current-main-info">
                    <img src="./icons/local.svg" alt="Ícone do tempo" id="current-icon" class="weather-icon-large"> <div class="temp-and-desc">
                        <div class="main-temp">
                            <span id="current-temp-value">-°C</span>
                        </div>
                        <p class="description" id="current-description">-</p>
                    </div>
                </div>

                <div class="current-details">
                    <div class="detail-item">
                        <img src="./icons/local.svg" alt="Local" class="inline-icon">
                        <h3 id="current-location">Cidade, UF</h3>
                    </div>
                    <div class="detail-item">
                        <p>Hoje, <span id="current-day-of-week">-</span></p>
                    </div>
                    <div class="detail-item">
                        <img src="./icons/termometro.svg" alt="Termômetro" class="inline-icon">
                        <p>Sensação térmica: <span id="current-feels-like">-°C</span></p>
                    </div>
                    <div class="detail-item">
                        <img src="./icons/gota.svg" alt="Gota de umidade" class="inline-icon">
                        <p>Umidade: <span id="current-humidity">-%</span></p>
                    </div>
                </div>

                <div class="refresh-container">
                    <button id="refresh-weather" class="refresh-btn" title="Atualizar previsão">
                        <img src="./icons/atualizar.svg" alt="Atualizar">
                    </button>
                </div>
            </div>

            <div class="weekly-forecast">
                <ul class="forecast-list" id="forecast-list">
                    <li class="forecast-day-placeholder">Carregando previsão da semana...</li>
                </ul>
            </div>
        </div>

        <div class="controls-container">
            
            <div class="card rgb-card">
                <div class="RGB">
                    <div>
                        <input type="range" class="sliderR" id="red" min="0" max="255" value="0" oninput="updateLED()">
                    </div>
                    <div>
                        <input type="range" class="sliderG" id="green" min="0" max="255" value="0" oninput="updateLED()">
                    </div>
                    <div>
                        <input type="range" class="sliderB" id="blue" min="0" max="255" value="0" oninput="updateLED()">
                    </div>
                </div>
            </div>


            <div class="card servo-card">
                <div class="servo-control">
                    <div class="speed-slider-container" id="speedSliderContainer">
                        <div class="speed-track" id="speedTrack"></div>
                    </div>

                    <div class="servo-buttons">
                        <button type="button" class="motor-btn open-btn" onclick="openMotor()">Abrir</button>
                        <button type="button" class="motor-btn close-btn" onclick="closeMotor()">Fechar</button>
                    </div>
                </div>
            </div>

            </div>

            <div class="spotify-player-fixed" id="spotifyPlayerFixed" style="display: none;">
                    <div class="spotify-player" id="spotifyPlayer">
                        <div class="spotify-main-content">
                            <img src="" alt="Album" id="spotifyAlbumArt" class="spotify-album-art">
                            <div class="spotify-content-right">
                                <div class="spotify-track-info">
                                    <span class="spotify-track-name" id="spotifyTrackName">-</span>
                                    <span class="spotify-artist-name" id="spotifyArtistName">-</span>
                                </div>
                                <div class="spotify-progress">
                                    <span class="spotify-time-current" id="spotifyTimeCurrent">0:00</span>
                                    <div class="spotify-progress-bar" id="spotifyProgressBar">
                                        <div class="spotify-progress-fill" id="spotifyProgressFill"></div>
                                    </div>
                                    <span class="spotify-time-total" id="spotifyTimeTotal">0:00</span>
                                </div>
                            </div>
                        </div>

                        <div class="spotify-bottom-bar">
                            <div class="spotify-controls-wrapper">
                                <div class="spotify-controls">
                                    <button class="spotify-ctrl-btn" onclick="spotifyPrevious()">
                                        <img src="./icons/spotify-previous.svg" alt="Anterior" width="24" height="24">
                                    </button>
                                    <button class="spotify-ctrl-btn" id="spotifySeekBackwardBtn" onclick="spotifySeekBackward()" title="Voltar 15s" style="display: none;">
                                        <img src="./icons/backward.png" alt="Voltar 15s" width="28" height="28">
                                    </button>
                                    <button class="spotify-ctrl-btn spotify-play-btn" id="spotifyPlayBtn" onclick="spotifyTogglePlay()">
                                        <svg viewBox="0 0 24 24" id="spotifyPlayIcon"><path d="M8 5v14l11-7z"/></svg>
                                        <svg viewBox="0 0 24 24" id="spotifyPauseIcon" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                                    </button>
                                    <button class="spotify-ctrl-btn" id="spotifySeekForwardBtn" onclick="spotifySeekForward()" title="Avançar 15s" style="display: none;">
                                        <img src="./icons/forward.png" alt="Avançar 15s" width="28" height="28">
                                    </button>
                                    <button class="spotify-ctrl-btn" onclick="spotifyNext()">
                                        <img src="./icons/spotify-next.svg" alt="Próxima" width="24" height="24">
                                    </button>
                                </div>
                            </div>

                            <div class="spotify-volume">
                                <img src="./icons/volume.svg" alt="Volume" width="20" height="20" class="volume-icon">
                                <input type="range" id="spotifyVolume" min="0" max="100" value="50" oninput="spotifySetVolume(this.value)">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
