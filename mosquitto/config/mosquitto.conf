# MQTT Broker Configuration for ZhiJia

# Listener for standard MQTT (ESP32 connects here)
listener 1883
protocol mqtt
allow_anonymous true

# Listener for WebSockets (Frontend connects here)
listener 9001
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection settings
max_connections 100
max_keepalive 65535